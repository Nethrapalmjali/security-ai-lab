<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security &amp; AI Lab</title>
<meta name="description" content="Browser-based cybersecurity and applied AI tools by Nethrapalmjali.">
<style>
  :root { --bg:#0b0f14; --card:#131a22; --line:#223040; --text:#e6edf3; --muted:#8b98a5; --accent:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 8px; font-size:2rem; }
  .sub { color:var(--muted); margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  a.card { display:block; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition:border-color .15s; }
  a.card:hover { border-color:var(--accent); }
  .tag { display:inline-block; font-size:.75rem; color:var(--accent); border:1px solid var(--line); border-radius:999px; padding:2px 10px; margin-bottom:10px; }
  .card h2 { margin:0 0 6px; font-size:1.1rem; }
  .card p { margin:0; color:var(--muted); font-size:.92rem; }
  .date { margin-top:12px; font-size:.8rem; color:var(--muted); }
  .empty { color:var(--muted); }
  footer { margin-top:48px; color:var(--muted); font-size:.85rem; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Security &amp; AI Lab</h1>
  <p class="sub">Small, self-contained tools for cybersecurity and applied AI. Everything runs client-side.</p>
  <div id="grid" class="grid"><p class="empty">Loading projects…</p></div>
  <footer>Source on <a href="https://github.com/Nethrapalmjali/security-ai-lab">GitHub</a> · MIT licensed</footer>
</main>
<script>
fetch('projects.json').then(r => r.json()).then(list => {
  const grid = document.getElementById('grid');
  if (!list.length) { grid.innerHTML = '<p class="empty">First project coming soon.</p>'; return; }
  grid.innerHTML = '';
  list.slice().reverse().forEach(p => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = 'projects/' + encodeURIComponent(p.slug) + '/';
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = p.category;
    const h = document.createElement('h2'); h.textContent = p.title;
    const d = document.createElement('p'); d.textContent = p.description;
    const dt = document.createElement('div'); dt.className = 'date'; dt.textContent = p.date;
    a.append(tag, h, d, dt); grid.append(a);
  });
}).catch(() => { document.getElementById('grid').innerHTML = '<p class="empty">Could not load projects.</p>'; });
</script>
</body>
</html>
